# Builds the kt-llama.cpp CUDA image and publishes it to GitHub Container Registry.
name: kt docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: kt-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cuda:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=cuda,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=cuda-
            type=ref,event=tag,prefix=cuda-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .devops/kt-cuda.Dockerfile
          build-args: APP_REVISION=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
